name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          find . -maxdepth 2 -name package.json -execdir npm install \;

      - name: Run TypeScript build checks
        run: |
          for d in chap*/; do
            if [ -f "$d/package.json" ] && grep -q 'typescript' "$d/package.json"; then
              echo "Checking $d"
              (cd "$d" && npm run build --if-present) || true
            fi
          done
